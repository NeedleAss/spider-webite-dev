<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareRover V4 · 实际截图验收</title><style>body{margin:0;background:#101216;color:#e4e8ee;font:16px/1.6 system-ui}header{max-width:1440px;margin:auto;padding:40px 24px 20px}h1{margin:0;font-size:30px}p{color:#9da9b7}select{font:inherit;background:#202630;color:inherit;border:1px solid #455365;border-radius:8px;padding:8px;margin-right:12px}main{padding:12px 24px 40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}figure{margin:0;min-width:0}img{width:100%;height:auto;background:#08090b;display:block}figcaption{padding:12px;color:#aab4c0;font-size:13px}a{color:#89dbe9}@media(max-width:850px){main{grid-template-columns:1fr}}</style><header><h1>每一帧，都来自实际页面。</h1><p>84 帧 · 四种视口 · 开头 / 中间 / 结束。手机为桌面模拟视口。小动画情节请看 <a href="story-tour.webm">正反向滚屏录像</a>。</p><label>视口 <select id="viewport"><option>1440</option><option>1366</option><option>390</option><option>844</option></select></label><label>章节 <select id="chapter"><option value="meet">认识整机</option><option value="inside">打开机身</option><option value="vision">看见目标</option><option value="range">前方测距</option><option value="motion">整车运动</option><option value="care">接触与显示</option><option value="whole">回到实物</option></select></label></header><main id="frames"></main><script>const names={start:'开头',middle:'中间',end:'结束'};function render(){const width=document.getElementById('viewport').value,id=document.getElementById('chapter').value;document.getElementById('frames').replaceChildren(...Object.entries(names).map(([phase,label])=>{const figure=document.createElement('figure'),a=document.createElement('a'),img=document.createElement('img'),caption=document.createElement('figcaption');a.href=img.src=`milestone-${width}-${id}-${phase}.png`;img.alt=`${width} · ${id} · ${label}`;caption.textContent=img.alt;a.append(img);figure.append(a,caption);return figure;}));}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',render));render();</script></html>
