name: Publish CareRover website
on:
  push:
    branches: [main, codex/v7-samples]
    paths: ['presentation/**', 'index.html', 'css/**', 'js/**', 'docs/protocol.md', 'tools/build_pages.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python3 tools/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
